<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grano&Click - Bienvenidos</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Contrail+One&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Tilt+Prism&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./css/base/main.css" />
  <link rel="icon" href="./assets/images/brand/favicon.png" />
</head>

<body>
  <header id="navbar-container"></header>

  <div class="container main-wrapper" id="indexHere">
    <main id="page-content">
      <section class="hero-section mt-4 mb-5">
        <div class="hero-grid">
          <div class="hero-card hero-left">
            <img class="img-fluid rounded-img" alt="Latte Art" data-img="main-hero-left">
          </div>
          <div class="hero-card hero-center">
            <div class="overlay"></div>
            <div class="content-relative text-center p-4">
              <h1 class="brand-title mb-4" data-i18n="hero-brand"></h1>
              <div class="info-item mb-4">
                <i class="bi bi-stopwatch fs-2 feature-icon"></i>
                <h5 class="mt-2" data-i18n="feat-1-title"></h5>
                <p data-i18n="feat-1-desc"></p>
              </div>
              <div class="info-item mb-4">
                <i class="bi bi-cup-hot fs-2 feature-icon"></i>
                <h5 class="mt-2" data-i18n="feat-2-title"></h5>
                <p data-i18n="feat-2-desc"></p>
              </div>
              <div class="info-item">
                <i class="bi bi-heart fs-2 feature-icon"></i>
                <h5 class="mt-2" data-i18n="feat-3-title"></h5>

                <p data-i18n="feat-3-desc"></p>
              </div>
            </div>
          </div>
          <div class="hero-card hero-right">
            <img class="img-fluid rounded-img" alt="Cake photo" data-img="main-hero-right">

          </div>
        </div>
      </section>



      <section class="products-container p-4 p-md-5 mb-5">
        <header class="text-center mb-5">
          <h2 data-i18n="section-classics-title"></h2>
        </header>
        <div class="products-layout">

          <div class="small-products-group">

            <div class="product-card text-center">
              <div class="img-box mb-3">
                <img src="" alt="Coffe Espresso" data-img="main-prod-1" loading="lazy">
              </div>
              <p class="product-name" data-i18n="main-prod-1"></p>
              <a class="btn btn-details" data-route="productos.html" data-hash="coffeTitle" data-i18n="btn-call-1"></a>
            </div>
            <div class="product-card text-center">
              <div class="img-box mb-3">
                <img src="" alt="Coffe Premium" data-img="main-prod-2">

              </div>
              <p class="product-name" data-i18n="main-prod-2"></p>
              <a class="btn btn-details" data-route="productos.html" data-hash="coffeTitle" data-i18n="btn-call-2"></a>

            </div>
            <div class="product-card text-center">
              <div class="img-box mb-3">
                <img src="" alt="Pastry" data-img="main-prod-3" loading="lazy">
              </div>
              <p class="product-name" data-i18n="main-prod-3"></p>
              <a class="btn btn-details" data-route="productos.html" data-hash="coffeTitle" data-i18n="btn-call-3"></a>
            </div>

          </div>

          <div class="large-products-group">
            <div class="large-img-box">
              <img src="" class="img-fluid" alt="Mesa de postres" data-img="main-large-prod-1"loading="lazy">
            </div>
            <div class="large-img-box">
              <img src="" class="img-fluid" alt="Panes variados" data-img="main-large-prod-2" loading="lazy">
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <script type="module" src="./js/main.js"></script>
  <!-- <script src="./js/apiSesion.js"></script>
   -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
