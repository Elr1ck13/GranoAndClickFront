<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/formularioCreacion.css">
  <link rel="stylesheet" href="../css/main.css">

  <link rel="icon" href="../assets/IconoLogo.png">
</head>

<body>

  <header id="encabezado"></header>

  <main class="main-content">

    <div class="container form-login mt-3">
      <h1 class="text-center mb-3">Iniciar Sesión</h1>

      <form id="loginForm">
        <label for="emails" class="frmlbl">Correo:</label>
        <input type="email" placeholder="Correo" class="frminp" id="emails">

        <label for="pass" class="frmlbl">Contraseña:</label>
        <input type="password" placeholder="Contraseña" class="frminp" id="pass">

        <button class="Btn" id="send" type="submit">
          Iniciar Sesión
          <svg class="svgIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <path d="M8.5 10c-.276 0-.5-.448-.5-1s.224-1 .5-1 .5.448.5 1-.224 1-.5 1" />
            <path d="M10.828.122A.5.5 0 0 1 11 .5V1h.5A1.5 1.5 0 0 1 13 2.5V15h1.5a.5.5 0 0 1 0 1h-13a.5.5 0 0 1 0-1H3V1.5a.5.5 0 0 1 .43-.495l7-1a.5.5 0 0 1 .398.117" />
          </svg>
        </button>

        <a href="./recuperarContra.html" class="frma">¿Olvidaste tu contraseña?</a><br>
        <a href="./signin.html" class="frma">¿Eres nuevo?, Crea tu cuenta</a>
      </form>
    </div>

  </main>

  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/navBarAndFooter.js"></script>
  <script src="../js/login.js"></script>

</body>
</html>
